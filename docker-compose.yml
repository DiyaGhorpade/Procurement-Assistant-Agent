services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
      POSTGRES_DB: procurement_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://procurement:procurement@db:5432/procurement_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: gpt-4o-mini
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./data:/app/data:ro  
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed_db.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pg_data: